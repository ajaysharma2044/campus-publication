# Crawler and indexing policy for the live site, in one place (docs/v5/prelaunch-spec.md Phase 9b; earlier the v3 catch-up part 2, step 5).
# The Astro build writes robots.txt from the two lists when LAUNCHED=true (site/src/pages/robots.txt.ts); until then robots.txt is
# Disallow: / for everyone. scripts/v2/render_site.py does the same for the Jinja preview. scripts/v2/indexnow.py (run by publish.sh
# after each deploy) submits only the URLs whose sitemap <lastmod> is new or changed since the last run, and logs every URL and response code.
# Token spellings checked against each company's crawler documentation on 2026-11-11 (OpenAI, Google, Common Crawl, Perplexity,
# Anthropic, Apple, Meta); Bing's help page would not load, so Bingbot keeps its long-standing spelling; Bytespider (ByteDance) was not re-verified.
allow:                 # search and retrieval: blocking these costs search or AI-search visibility
  - Googlebot
  - Bingbot
  - OAI-SearchBot      # ChatGPT search listings
  - ChatGPT-User       # user-triggered fetches (not used for training)
  - PerplexityBot
  - Perplexity-User
  - Claude-SearchBot
  - Claude-User
  - Applebot           # Spotlight, Siri and Safari search; the training opt-out is Applebot-Extended below
  - Meta-WebIndexer    # Meta AI search citations
disallow:              # AI training crawlers: blocking these does not affect search inclusion per the companies' docs
  - GPTBot
  - Google-Extended    # a control token, not a crawler: Gemini training and grounding
  - CCBot
  - ClaudeBot
  - Applebot-Extended
  - meta-externalagent
  - Bytespider
indexnow:
  key_file: config/indexnow.key            # 32 hex characters; served at https://<domain>/<key>.txt
  endpoint: https://api.indexnow.org/indexnow
  log: reports/indexnow.log                # one line per URL: time | response code | URL
  state: build/indexnow-state.json         # URL -> lastmod last submitted, so a publish resubmits only new and changed pages
