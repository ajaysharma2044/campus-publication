<div class="tool" id="tool-off-campus-move-in-checklist-cornell" data-tool="off-campus-move-in-checklist-cornell" data-as-of="2026-11-11">
  <style>
    #tool-off-campus-move-in-checklist-cornell .omc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.75rem 1rem;margin:0 0 1rem}
    #tool-off-campus-move-in-checklist-cornell label{display:block;font-weight:600;margin-bottom:.2rem}
    #tool-off-campus-move-in-checklist-cornell select,#tool-off-campus-move-in-checklist-cornell input[type=number],#tool-off-campus-move-in-checklist-cornell input[type=date]{width:100%;max-width:100%}
    #tool-off-campus-move-in-checklist-cornell .omc-check label{display:inline;font-weight:600}
    #tool-off-campus-move-in-checklist-cornell .omc-result ul{padding-left:1.2rem;margin:0}
    #tool-off-campus-move-in-checklist-cornell .omc-result li{margin:.35rem 0}
    #tool-off-campus-move-in-checklist-cornell .omc-note{font-size:.875em;opacity:.8;margin-top:.75rem}
  </style>
  <form class="omc-grid" onsubmit="return false">
    <div><label for="off-campus-move-in-checklist-cornell-place">Where the place is</label>
      <select id="off-campus-move-in-checklist-cornell-place">
        <option value="city" selected>City of Ithaca (Collegetown, downtown, Fall Creek, Belle Sherman)</option>
        <option value="out">Outside the City (Town of Ithaca, Lansing, Cayuga Heights, Varna)</option>
      </select></div>
    <div><label for="off-campus-move-in-checklist-cornell-date">Move-in date (lease start)</label>
      <input id="off-campus-move-in-checklist-cornell-date" type="date" value="2027-08-01" min="2026-11-08" max="2028-12-31"></div>
    <div><label for="off-campus-move-in-checklist-cornell-elec">Electricity</label>
      <select id="off-campus-move-in-checklist-cornell-elec">
        <option value="pay" selected>We pay NYSEG ourselves</option>
        <option value="inc">Included in rent</option>
      </select></div>
    <div><label for="off-campus-move-in-checklist-cornell-net">Internet</label>
      <select id="off-campus-move-in-checklist-cornell-net">
        <option value="pay" selected>We set it up and pay</option>
        <option value="inc">Included in rent</option>
      </select></div>
    <div><label for="off-campus-move-in-checklist-cornell-trash">Trash pickup</label>
      <select id="off-campus-move-in-checklist-cornell-trash">
        <option value="tags" selected>We buy tags or pay for it</option>
        <option value="inc">Landlord handles it</option>
      </select></div>
    <div><label for="off-campus-move-in-checklist-cornell-people">People splitting the bills</label>
      <input id="off-campus-move-in-checklist-cornell-people" type="number" min="1" max="10" step="1" value="4"></div>
    <div><label for="off-campus-move-in-checklist-cornell-car">Car</label>
      <select id="off-campus-move-in-checklist-cornell-car">
        <option value="none" selected>No car</option>
        <option value="lot">Car, parked in the landlord's lot or driveway</option>
        <option value="street">Car, parked on a City street</option>
        <option value="garage">Car, parked in a City garage</option>
      </select></div>
    <div><label for="off-campus-move-in-checklist-cornell-status">Your Cornell status this year</label>
      <select id="off-campus-move-in-checklist-cornell-status">
        <option value="new">New degree student (first-year, transfer or new grad)</option>
        <option value="phd">PhD student or graduate assistant</option>
        <option value="other" selected>Continuing student, not a PhD or GA</option>
      </select></div>
    <div class="omc-check"><input id="off-campus-move-in-checklist-cornell-occ" type="checkbox">
      <label for="off-campus-move-in-checklist-cornell-occ">Someone will live there who is not on the lease</label></div>
    <div class="omc-check"><input id="off-campus-move-in-checklist-cornell-abroad" type="checkbox">
      <label for="off-campus-move-in-checklist-cornell-abroad">I'm arriving from abroad</label></div>
    <div class="omc-check"><input id="off-campus-move-in-checklist-cornell-new" type="checkbox">
      <label for="off-campus-move-in-checklist-cornell-new">It's a new building opening this year</label></div>
    <div class="omc-check"><input id="off-campus-move-in-checklist-cornell-help" type="checkbox">
      <label for="off-campus-move-in-checklist-cornell-help">A parent or family member is driving in to help</label></div>
  </form>
  <div class="omc-result" id="off-campus-move-in-checklist-cornell-result" aria-live="polite">
    <p>Set where you live, your move-in date, who pays which bills and whether you have a car, and your dated checklist appears here. Rules and prices are from official pages read on 2026-11-08.</p>
  </div>
  <script>
  (function () {
    var root = document.getElementById('tool-off-campus-move-in-checklist-cornell');
    if (!root) return;
    var P = 'off-campus-move-in-checklist-cornell-';
    function el(id) { return root.querySelector('#' + P + id); }
    var U = {
      gol: 'https://www.nysenate.gov/legislation/laws/GOB/7-108',
      moveOut: 'https://scl.cornell.edu/residential-life/housing/living-off-campus/housing-search-process/moving-and-out',
      occ: 'https://www.nysenate.gov/legislation/laws/RPP/235-F',
      tags: 'https://www.cityofithacany.gov/168/Trash-Yard-Waste-Collection-Tags',

      nyseg: 'https://www.nyseg.com/support/moving-help',
      rates: 'https://www.fingerlakes1.com/2026/05/15/nyseg-and-rge-win-temporary-rate-hikes-as-larger-increases-still-loom/',

      po: 'https://poweroutage.us/electricity-rates/ny/ithaca',

      park: 'https://fcs.cornell.edu/departments/transportation-delivery-services/parking/parking-students',
      sales: 'https://fcs.cornell.edu/node/17809',
      cityPermit: 'https://www.cityofithacany.gov/731/Permit-Issuance',
      r3: 'https://news.cornell.edu/node/278473',
      dryden: 'https://www.cityofithacany.gov/718/Dryden-Road-Garage',
      green: 'https://www.cityofithacany.gov/716/Green-Street-Garage',

    var D = '2026-11-08';
    const NUMBERS = {

      trashTag: { value: 6, asOf: '2026-01-01', source: U.tags },
      trashSheet: { value: 36, asOf: '2026-01-01', source: U.tags },
      trashLbs: { value: 35, asOf: D, source: U.tags },
      setOutHours: { value: 24, asOf: D, source: U.ext },
      elecLow: { value: 104.20, asOf: D, source: U.po },
      elecHigh: { value: 282, asOf: '2026-11-08', source: U.es },
      netLow: { value: 30, asOf: D, source: U.isp },
      netHigh: { value: 120, asOf: D, source: U.isp },
      insLow: { value: 5, asOf: '2026-09-11', source: U.sb },
      insTypical: { value: 13, asOf: D, source: U.ggBlog },
      insHigh: { value: 27, asOf: D, source: U.insCom },
      bPermit: { value: 359.77, asOf: D, source: U.park },
      permitSales2026: { value: '2026-08-04', asOf: D, source: U.sales },
      cityPermit: { value: 45, asOf: D, source: U.cityPermit },
      visitorPass: { value: 10, asOf: D, source: U.cityPermit },
      drydenMonthly: { value: 232, asOf: D, source: U.dryden },
      drydenWorker: { value: 185, asOf: D, source: U.dryden },
      drydenDayMax: { value: 18, asOf: D, source: U.dryden },
      greenMonthly: { value: 117, asOf: D, source: U.green },
      meterHour: { value: 2.5, asOf: D, source: U.pinfo },
      garageHour: { value: 2.25, asOf: D, source: U.pinfo },
      towHours: { value: 72, asOf: D, source: U.regs },
      fare: { value: 1.5, asOf: D, source: U.bus },
      omniride: { value: 200, asOf: D, source: U.bus },
      fontanaDay: { value: 30, asOf: '2016-09-01', source: U.fontana }
    };
    var MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    function utc(y, m, d) { return Date.UTC(y, m - 1, d); }
    function fd(t) { var d = new Date(t); return WD[d.getUTCDay()] + ' ' + MO[d.getUTCMonth()] + ' ' + d.getUTCDate() + ', ' + d.getUTCFullYear(); }
    function money(v) { return '$' + (Math.round(v * 100) % 100 ? v.toFixed(2) : String(Math.round(v))).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
    function n(k, txt) { var e = NUMBERS[k]; return '<span data-as-of="' + e.asOf + '">' + (txt == null ? money(e.value) : txt) + '</span>'; }
    function a(href, txt) { return '<a href="' + href + '" rel="noopener">' + txt + '</a>'; }
    function render() {
      var city = el('place').value === 'city', elec = el('elec').value === 'pay', net = el('net').value === 'pay';
      var tags = el('trash').value === 'tags', car = el('car').value, status = el('status').value;
      var occ = el('occ').checked, abroad = el('abroad').checked, nb = el('new').checked, help = el('help').checked;
      var ppl = Math.max(1, Math.min(10, Math.round(+el('people').value || 1)));
      var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(el('date').value || '') || [0, '2027', '08', '01'];
      var Y = +m[1], M = +m[2], Dd = +m[3], t0 = utc(Y, M, Dd), DAY = 86400000;
      var G = { before: [], day: [], month: [], later: [] }, dated = 0;
      function add(g, h, isDated) { G[g].push(h); if (isDated) dated++; }
      var lo = 0, hi = 0;
      add('before', 'Accept the move-in inspection. After you sign and before you move in, the landlord must offer one; if you accept, you both sign a written record of the condition, and the landlord cannot keep deposit money for defects listed on it. ' + a(U.gol, 'GOL 7-108'));
      add('before', 'Buy renters insurance before the keys change hands. Cornell\'s checklist says to buy it and names GradGuard as its preferred insurer; Ithaca and New York quotes run ' + n('insLow') + ' to ' + n('insHigh') + ' a month, about ' + n('insTypical') + ' typical. Check whether your lease requires proof. ' + a(U.gg, 'Cornell') + ', ' + a(U.sb, 'SafeButler'));
      lo += NUMBERS.insLow.value; hi += NUMBERS.insHigh.value;
      if (elec) {
        add('before', 'Start electricity in a tenant\'s name for ' + fd(t0) + ': "Turn On Service" at nyseg.com, the Request for Service form at nyseg.com/Moving, or call 800.572.1111 (Mon-Fri 7 a.m. to 7 p.m.). An indoor meter needs access arranged; service off for over two years needs a safety inspection. ' + (city ? '' : 'Outside the City, confirm with the landlord which utility serves the address. ') + a(U.nyseg, 'NYSEG'), true);
        lo += NUMBERS.elecLow.value / ppl; hi += NUMBERS.elecHigh.value / ppl;
      }
      if (net) {
        add('before', 'Order internet so it works on day one. Aggregator sites list plans at ' + n('netLow') + ' to ' + n('netHigh') + ' a month for the household, promo and regular prices mixed. Ask the landlord which providers wire the building. ' + a(U.isp, 'ISP Reports'));
        lo += NUMBERS.netLow.value / ppl; hi += NUMBERS.netHigh.value / ppl;
      }
      if (nb) add('before', 'Ask in writing what happens if the building is not ready by ' + fd(t0) + ': where you sleep, who pays, and the compensation. In 2016 Fontana (327 Eddy St) left 50+ students with Aug 1 leases waiting until September, offered a hotel or ' + n('fontanaDay') + ' a day; Cornell\'s 301 College Ave opened in Aug 2026 and a resident described it as incomplete and rushed. ' + a(U.fontana, 'Sun 2016') + ', ' + a(U.c301, 'Sun 2026'), true);
      if (abroad) {
        add('before', 'Before you fly: confirm the move-in date and time, what is furnished, and who sets up NYSEG and internet. You do not need an SSN to rent. ' + (city ? 'Check the address\'s Certificate of Compliance (607-274-6508, ibd@cityofithaca.org) before you wire money. ' : 'The City\'s Certificate of Compliance and Cornell\'s safety tool do not cover addresses outside the City. ') + a(U.intl, 'Cornell International Services') + ', ' + a(U.coc, 'Cornell'));
      }
      add('day', 'Photograph every room, wall, floor, appliance and existing damage before you unpack, and keep the files with the signed condition record; Cornell\'s move-out page says to take photos at move-in and move-out. At move-out the landlord has ' + n('depositDays', NUMBERS.depositDays.value + ' days') + ' to return the deposit or itemize deductions. ' + a(U.moveOut, 'Cornell') + ', ' + a(U.gol, 'GOL 7-108'));
      if (help) add('day', 'Move-in parking for the helper: City meters ' + n('meterHour') + ' an hour (9 a.m. to 6 p.m. Mon-Sat, free Sundays), City garages ' + n('garageHour') + ' an hour, Dryden Road Garage (118 Dryden Rd) daily maximum ' + n('drydenDayMax') + '. ' + (city ? 'In a residential permit area, a ' + n('visitorPass') + ' visitor pass covers 2 weeks. ' : '') + a(U.pinfo, 'City parking') + ', ' + a(U.dryden, 'Dryden Road Garage'));
      if (tags && city) add('day', 'Buy City trash tags: ' + n('trashTag') + ' each or ' + n('trashSheet') + ' for a sheet of 6' + (Y > 2026 ? ' (2026 price; the City sets it each January 1)' : '') + ', one per can or bag up to ' + n('trashLbs', NUMBERS.trashLbs.value + ' lbs') + '. Sold at City Hall (108 E. Green St.), the Cornell Campus Store, Ace Hardware, GreenStar, P&C Fresh, Tops and Wegmans. Put trash out no more than ' + n('setOutHours', NUMBERS.setOutHours.value + ' hours') + ' before pickup and never leave a couch or mattress outside; the City\'s Resident Services Search Tool shows your pickup day. ' + a(U.tags, 'trash tags') + ', ' + a(U.ext, 'City rules'));
      if (tags && !city) add('day', 'Trash outside the City: City tags do not apply. Ask the landlord who collects it, how it is paid, and the pickup day.');
      if (occ) add('month', 'Give the landlord the name of anyone living there who is not on the lease by ' + fd(t0 + NUMBERS.occupantDays.value * DAY) + ' (' + n('occupantDays', NUMBERS.occupantDays.value + ' days') + ' after move-in, or within 30 days of the landlord asking). On a one-tenant lease you may add immediate family plus one more occupant and that person\'s dependent children; on a shared lease, tenants plus occupants cannot exceed the number of tenants named. Occupants get no right to stay if you leave. ' + a(U.occ, 'RPL 235-f'), true);
      if (status === 'new') add('month', 'Ride TCAT free all year with your Cornell ID: new degree students get unlimited rides until Aug 31 after the first year (Dec 31 for spring entrants). ' + a(U.bus, 'Cornell'));
      else if (status === 'phd') add('month', 'Get your free TCAT OmniRide pass at myparking.cornell.edu (PhD students and graduate assistants); allow up to 24 hours to activate. ' + a(U.bus, 'Cornell'));
      else add('month', 'Bus: you ride TCAT free after 6 p.m. weekdays and all weekend; daytime rides cost ' + n('fare') + ', or buy OmniRide for ' + n('omniride') + ' a year (prorated monthly) at myparking.cornell.edu. ' + a(U.bus, 'Cornell'));
      if (car !== 'none') {
        var py = (M > 8 || (M === 8 && Dd > 15)) ? Y + 1 : Y, pEnd = utc(py, 8, 15), left = Math.round((pEnd - t0) / DAY) + 1;
        var pTxt = left <= 31 ? 'Your move-in falls at the end of the permit year (permits run Aug 16 to Aug 15), so buy the next year\'s permit when sales open in early August: 2026-27 sales opened ' + n('permitSales2026', fd(utc(2026, 8, 4))) + ' at 9 a.m., first come, first served. Cornell has not yet announced the 2027-28 date.'
          : 'Permits prorate daily for the ' + left + ' days left to ' + fd(pEnd) + ': about ' + n('bPermit', money(NUMBERS.bPermit.value * left / 365)) + ' (our estimate on the ' + n('bPermit') + ' annual price).';
        add('month', 'Register your plate at myparking.cornell.edu; students must register even without a permit. To park on campus, the B commuter permit is ' + n('bPermit') + ' a year, limited, B lots any time and A lots after 2:30 p.m. ' + pTxt + (status === 'phd' ? ' Graduate assistants on full assistantships can buy faculty and staff permits instead.' : '') + ' Transportation Services 607-255-4600. ' + a(U.park, 'Cornell parking') + ', ' + a(U.sales, '2026-27 sales'), true);
        var nov = M >= 11 || M < 4 || (M === 4 && Dd === 1);
        var winterTxt = nov ? 'Winter rules are already on at your move-in: ' : 'From ' + fd(utc(Y, 11, 1)) + ': ';
        if (car === 'street' && !city) add('month', 'Street parking outside the City: City permits and winter rules do not apply; ask the landlord or the town or village office about overnight parking before you leave the car on the street.');
        if (car === 'street' && city) {
          var late = M === 6 || M === 7;
          add('month', 'City residential permit: ' + n('cityPermit') + ' a year at the City Clerk\'s Office if your block is in a permit area; bring your lease or a utility bill plus your registration. One plate, no partial-year price, and every permit ends July 31' + (late ? ', so one bought for a ' + MO[M - 1] + ' move-in expires ' + fd(utc(Y, 7, 31)) : '') + '. Central Collegetown (R-3) gets no street permits. Landlords cannot buy them for you. ' + a(U.cityPermit, 'City permits') + ', ' + a(U.r3, 'Cornell on R-3'), true);
          add('later', winterTxt + 'odd/even overnight parking, 7 p.m. to 6 a.m. until April 1 (odd side on odd dates), enforced when needed such as snow events; move the car at least every 24 hours on weekdays; a car unmoved ' + n('towHours', NUMBERS.towHours.value + ' hours') + ' can be towed. Text "SIREN" to 67283 for alerts. ' + a(U.regs, 'City rules'), true);
        }
        if (car === 'garage') add('month', 'Garage permit: Dryden Road Garage monthly ' + n('drydenMonthly') + ' (24/7, "recommended for Collegetown residents", no guaranteed space) or the ' + n('drydenWorker') + ' Worker\'s Special (weekdays only); Green Street Garage ' + n('greenMonthly') + ' a month (24/7 access). Sold in 30-day steps; renew online. ' + (nov ? 'The Dryden uncovered 4th and 5th floors are closed 2 to 8 a.m. now through April.' : 'From Nov 1 the Dryden uncovered 4th and 5th floors close 2 to 8 a.m.') + ' ' + a(U.dryden, 'Dryden Road') + ', ' + a(U.green, 'Green Street'), true);
        if (car === 'lot') add('month', 'Park only in the spaces the landlord assigns, up to the number allowed for the property; never on the grass or the sidewalk. Ask who plows the lot. ' + a(U.ext, 'City rules'));
        add('later', 'March 31: last day to return a Cornell permit for a prorated refund. Winter break: a car left on a City street may be treated as abandoned. ' + a(U.park, 'Cornell parking'), true);
      }
      if (elec) add('later', 'NYSEG bills: temporary rates rose June 1, 2026 and a larger permanent increase is still pending, so budget for the higher end. ' + a(U.rates, 'FingerLakes1'));
      var heads = { before: 'Before move-in day', day: 'Move-in day', month: 'In the first 30 days', later: 'Later dates to know' };
      var count = 0, html = '';
      ['before', 'day', 'month', 'later'].forEach(function (g) {
        if (!G[g].length) return;
        count += G[g].length;

      el('result').innerHTML = '<p><strong>' + count + ' things to do for a move-in on ' + fd(t0) + ', ' + dated + ' of them tied to a date.</strong> ' + cost + '</p>' + html +

    }

    root.addEventListener('change', render);
    render();
  })();
  </script>
