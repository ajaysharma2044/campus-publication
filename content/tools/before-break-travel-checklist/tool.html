<div class="tool" id="tool-before-break-travel-checklist" data-tool="before-break-travel-checklist" data-as-of="2026-11-08">
  <style>
    #tool-before-break-travel-checklist .bbc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.75rem 1rem;margin:0 0 1rem}
    #tool-before-break-travel-checklist label{display:block;font-weight:600;margin-bottom:.2rem}
    #tool-before-break-travel-checklist select,#tool-before-break-travel-checklist input[type=number]{width:100%;max-width:100%}
    #tool-before-break-travel-checklist .bbc-check label{display:inline;font-weight:600}
    #tool-before-break-travel-checklist .bbc-result h4{margin:1rem 0 .3rem}
    #tool-before-break-travel-checklist .bbc-result ul{padding-left:1.2rem;margin:0}
    #tool-before-break-travel-checklist .bbc-result li{margin:.35rem 0}
    #tool-before-break-travel-checklist .bbc-note{font-size:.875em;opacity:.8;margin-top:.75rem}
  </style>
  <form class="bbc-grid" onsubmit="return false">
    <div><label for="before-break-travel-checklist-break">Which break</label>
      <select id="before-break-travel-checklist-break">
        <option value="thanksgiving" selected>Thanksgiving (Thu Nov 26, 2026)</option>
        <option value="winter">Winter break 2026-27</option>
      </select></div>
    <div><label for="before-break-travel-checklist-stay">Leaving or staying</label>
      <select id="before-break-travel-checklist-stay">
        <option value="leaving" selected>Leaving Ithaca</option>
        <option value="staying">Staying in Ithaca</option>
      </select></div>
    <div><label for="before-break-travel-checklist-mode">How you travel</label>
      <select id="before-break-travel-checklist-mode">
        <option value="c2c" selected>Cornell C2C bus to NYC</option>
        <option value="bus">Commercial bus (OurBus, FlixBus, Greyhound, others)</option>
        <option value="plane">Plane</option>
        <option value="car">Driving my own car</option>
      </select></div>
    <div><label for="before-break-travel-checklist-airport">If flying: from which airport</label>
      <select id="before-break-travel-checklist-airport">
        <option value="ith" selected>Ithaca (ITH)</option>
        <option value="syr">Syracuse (SYR)</option>
        <option value="nyc">A NYC airport (JFK, LGA, EWR)</option>
      </select></div>
    <div><label for="before-break-travel-checklist-live">Where you live</label>
      <select id="before-break-travel-checklist-live">
        <option value="campus" selected>University housing</option>
        <option value="off">Off campus</option>
      </select></div>
    <div><label for="before-break-travel-checklist-car">Your car in Ithaca</label>
      <select id="before-break-travel-checklist-car">
        <option value="none" selected>No car</option>
        <option value="permit">In a campus lot with my permit</option>
        <option value="street">On a city street</option>
      </select></div>
    <div><label for="before-break-travel-checklist-days">Days away (for airport parking)</label>
      <input id="before-break-travel-checklist-days" type="number" min="1" max="40" step="1" value="5"></div>
    <div class="bbc-check"><input id="before-break-travel-checklist-store" type="checkbox">
      <label for="before-break-travel-checklist-store">I'm storing or shipping things</label></div>
  </form>
  <div class="bbc-result" id="before-break-travel-checklist-result" aria-live="polite">
    <p>Pick your break, how you travel, your car and your housing, and your checklist appears here. Every date and price is from pages read on 2026-11-08.</p>
  </div>
  <script>
  (function () {
    var root = document.getElementById('tool-before-break-travel-checklist');
    if (!root) return;
    var P = 'before-break-travel-checklist-';
    function el(id) { return root.querySelector('#' + P + id); }
    var U = {
      c2c: 'https://fcs.cornell.edu/departments/transportation-delivery-services/campus-campus-bus-service',

      tgPremiumLow: { value: 27.9, asOf: D, source: U.cmbBing },
      tgPremiumMean: { value: 33.3, asOf: D, source: U.cmbRoc },

      housingDeadline: { value: '2026-12-01', asOf: D, source: U.housing },
      housingWeek: { value: 125, asOf: D, source: U.housing },
      housingFull: { value: 500, asOf: D, source: U.housing },
      mailEnd: { value: '2026-12-23', asOf: D, source: U.housing },

      closing2025: { value: '2025-12-21', asOf: '2025-12-21', source: U.closing },
      storageBoxLow: { value: 150, asOf: D, source: U.ssBlog },
      storageBoxHigh: { value: 300, asOf: D, source: U.ssBlog },
      carshareJicYear: { value: 30, asOf: D, source: U.carshare },
      carshareJicHour: { value: 9, asOf: D, source: U.carshare }
    };
    var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    function utc(iso) { var p = iso.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
    function fd(iso) { var d = new Date(utc(iso)); return WD[d.getUTCDay()] + ' ' + MO[d.getUTCMonth()] + ' ' + d.getUTCDate() + ', ' + d.getUTCFullYear(); }
    function left(iso) {
      var t = new Date(), today = Date.UTC(t.getFullYear(), t.getMonth(), t.getDate());
      var n = Math.round((utc(iso) - today) / 86400000);
      return n > 1 ? n + ' days from today' : n === 1 ? 'tomorrow' : n === 0 ? 'today' : 'already passed';
    }
    function money(v) { return '$' + (v % 1 ? v.toFixed(2) : String(v)); }
    function n(k, txt) {
      var e = NUMBERS[k], v = e.value;

      return '<span data-as-of="' + e.asOf + '">' + txt + '</span>';
    }
    function $n(k) { return n(k, money(NUMBERS[k].value)); }
    function a(href, txt) { return '<a href="' + href + '" rel="noopener">' + txt + '</a>'; }
    function render() {
      var brk = el('break').value, stay = el('stay').value, mode = el('mode').value, ap = el('airport').value;
      var live = el('live').value, car = el('car').value, store = el('store').checked;
      var days = Math.max(1, Math.min(40, Math.round(+el('days').value || 1)));
      var winter = brk === 'winter', leaving = stay === 'leaving';
      var G = leaving ? { now: 'Do now', before: 'Before you leave', day: 'Travel day', back: 'Coming back' }
                      : { now: 'Do now', before: 'Before the break starts', day: 'During the break', back: 'After the break' };
      var items = { now: [], before: [], day: [], back: [] }, dates = [];
      function add(g, h) { items[g].push(h); }
      function due(label, k) { dates.push([NUMBERS[k].value, label]); }
      if (leaving && mode === 'c2c') {
        add('now', 'Make a new C2C account: since ' + n('c2cNewSystem') + ' everyone needs one, past riders too. Sign in with Cornell single sign-on for the ' + $n('c2cNetid') + ' NetID fare; a plain account pays ' + $n('c2cPublic') + ' one way. ' + a(U.c2cNew, 'C2C notice'));

        add('day', 'Be at the stop ' + n('c2cBoardMinutes') + ' minutes early with a photo ID that matches the booking. Limit: ' + n('c2cSuitcases') + ' suitcases below deck plus 2 small carry-ons. ' + a(U.c2cPol, 'C2C policies'));
      }
      if (leaving && mode === 'bus') {
        add('now', 'Book peak days now. OurBus names the Wednesday before Thanksgiving (' + n('peakWednesday') + ', ' + left(NUMBERS.peakWednesday.value) + '), the last day of December finals and the Friday spring break begins. ' + a(U.obBlog, 'OurBus'));
        if (!winter) add('now', 'Expect higher fares: Thanksgiving-week lowest fares on 3 Ithaca routes ran ' + n('tgPremiumLow', '+' + NUMBERS.tgPremiumLow.value + '%') + ' to ' + n('tgPremiumHigh', '+' + NUMBERS.tgPremiumHigh.value + '%') + ' above earlier November days (mean ' + n('tgPremiumMean', '+' + NUMBERS.tgPremiumMean.value + '%') + '; 51 fares read Nov 8, 2026; NYC not sampled).');
        else add('now', 'Coming back in January costs less: Ithaca-NYC fares averaged about ' + $n('nycAvgJan') + ' in January against about ' + $n('nycAvgNov') + ' in November on Wanderu. ' + a(U.wanderu, 'Wanderu'));
        add('before', 'Check your stop: from ' + n('ourbusStopMove') + ' the OurBus downtown stop is 235 S. Cayuga St. OurBus refunds a cancellation as credit, not cash, and rescheduling has a fee. ' + a(U.obMove, 'stop move') + ', ' + a(U.obCredit, 'Sun 2023'));
        add('day', 'Bags: OurBus guarantees one bag per ticket and extra bags are ' + $n('ourbusExtraBag') + ' prepaid; Greyhound includes one carry-on and one checked bag. ' + a(U.bags, 'Sun 2024'));
      }
      if (leaving && mode === 'plane') {
        add('now', 'Book flights early and keep a backup airport. ' + (winter ? 'Free Student Assembly charters to ITH and SYR ran in past finals weeks; none was found for fall 2026 as of Nov 8, so watch Campus Groups. ' + a(U.sa, 'SA R83') : 'No Cornell Thanksgiving airport shuttle was found for 2026; the last one ran in 2023. ' + a(U.tgShuttle, 'Sun 2023')));
        if (ap === 'ith') add('before', 'ITH has two scheduled nonstops (JFK on Delta, IAD on United), so one cancellation can strand you. TCAT 32 (weekdays) and 72 (weekends) run to the Commons for ' + $n('tcatAirportFare') + ', but no bus meets dawn flights: prebook a taxi (Ithaca Airport Cab 607-252-9052, Collegetown Cab 607-588-8888, Ithaca Dispatch 607-277-7777). ' + a(U.ithAir, 'airlines') + ', ' + a(U.taxis, 'taxis'));
        if (ap === 'syr') add('before', 'Book the OurBus to SYR Terminal A with the flight: ' + $n('ourbusSyrLow') + ' to ' + $n('ourbusSyrHigh') + ' each way, Sunday cheapest, six days a week, from North Campus behind Ganedago Hall, West Ave across from Baker Flagpole or the Cayuga St Garage. ' + a(U.obSyr, 'OurBus'));
        if (ap === 'nyc') add('before', 'No bus runs direct to JFK or LaGuardia: ride to Manhattan and transfer. For Newark, FlixBus runs direct to Newark Penn, not the airport. Leave a big buffer between bus and flight. ' + a(U.newark, 'checkmybus') + ', ' + a(U.intl, 'Sun 2019'));
        if (car !== 'none' && ap !== 'nyc') {
          var ith = Math.floor(days / 7) * NUMBERS.ithLongWeek.value + Math.min((days % 7) * NUMBERS.ithLongDay.value, NUMBERS.ithLongWeek.value);

          add('before', 'Leaving the car at the airport for ' + days + ' days: about ' + n('ithLongWeek', money(ith)) + ' at ITH long-term (' + $n('ithLongDay') + ' a day, ' + $n('ithLongWeek') + ' a week) or about ' + n('syrEconomyDay', money(syr)) + ' at SYR economy (' + $n('syrEconomyDay') + ' daily max, no weekly rate shown). ' + a(U.ithPark, 'ITH') + ', ' + a(U.syrPark, 'SYR'));
        }

      }
      if (leaving && mode === 'car') add('before', 'Driving: plan the trip back around the forecast (storm plan below) and clear the car before you go.');
      if (car === 'permit') add('before', 'Leave the car in your campus permit area for the break; Cornell allows it for students in university housing, year-round. Campus winter overnight rules start ' + n('campusWinterStart') + '; FH, ND, SW and WD permit holders park in their own lots as usual. ' + a(U.winterPark, 'winter rules'));

      }

        else add('now', 'Staying past Thanksgiving into winter break too? Apply for winter break housing by ' + n('housingDeadline') + ' (' + left(NUMBERS.housingDeadline.value) + '). ' + a(U.housing, 'Housing'));
        if (winter) add('day', 'Mail and packages stop ' + n('mailEnd') + ' and resume ' + n('mailResume') + '. ' + a(U.housing, 'Housing'));
      }
      if (!leaving && live === 'off') add('now', 'Off campus you need no break housing application. ' + a(U.housing, 'Housing'));
      if (!leaving) add('day', 'Plan food and errands: dining is usually closed the week the university is closed. Ithaca Carshare\'s student Just In Case plan costs ' + $n('carshareJicYear') + ' a year plus ' + $n('carshareJicHour') + ' an hour. TCAT holiday service is unconfirmed; a 2013 Sun column said no buses ran on Thanksgiving Day. ' + a(U.housing, 'Housing') + ', ' + a(U.carshare, 'Carshare'));

      if (leaving) {
        add('back', (winter ? 'January storm plan: in Jan 2019 a storm kept buses off most highways and Cornell\'s bus cancelled its Syracuse run. Keep a backup travel day. ' + a(U.stormJan, 'Sun 2019')

    root.addEventListener('change', render);

  })();
  </script>
