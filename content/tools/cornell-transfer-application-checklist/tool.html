        html += "<h3>" + heads[g] + " (" + G[g].length + ")</h3><ul>" + G[g].join("") + "</ul>";
      });
      var lead = "<p><strong>" + total + " items for " + el("program").options[el("program").selectedIndex].text + (to ? " as a Transfer Option holder" : "") + ": " + G.mar.length + " " + (to ? "with the Transfer Option application (due " + TOD + ")" : "due " + M15) + ", " + G.apr.length + " " + (to ? "from you and your schools" : "due " + A15) + ", " + G.after.length + " after admission.</strong> You complete " + mine + " of them yourself; the rest come from your school, an instructor, your family or Cornell.</p>";
      el("result").innerHTML = lead + html + "<p class='ctac-note' data-as-of='" + D + "'>Rules and dates as of 2026-11-11, for fall 2027 entry. Dates marked 2026 or 2024 are from earlier cycles and change when Cornell posts the 2027 versions. Nothing here is estimated; when a college page and the central page disagree (the Hotel resume), the item says so.</p>";
    }
    root.addEventListener("input", render);
    root.addEventListener("change", render);
    render();
  })();
