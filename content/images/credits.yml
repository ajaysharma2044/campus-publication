# Image credits ledger (Footnote Daily v2, docs/v2/spec.md "Images and visuals"): the rights record for every photo the site shows.
# A YAML list, one entry per file under content/images/<article_slug>/, written by scripts/v2/find_images.py (--article, --fetch):
#   file, article_slug, source (wikimedia|openverse|unsplash|pexels|owner|permission), page_url, author, license, license_url
#   (empty for a public-domain Commons file, which has no license deed), found_at, fetched_at, credit ("Author / Source";
#   the page shows "Photo: <credit>, <license>" with the credit linked to page_url and the license to license_url).
# Internet photos: every license field is copied from the API response, never guessed.
# Owner photos dropped in content/images/inbox/ get a source: owner entry from the script, credited to the site; edit its author
# and credit if someone else on the team took it (content/images/inbox/README.md). Photos used with written permission: change
# that entry to source: permission with page_url, author, license, credit and permission_file (docs/v2/photo-permission-email.md).
# For owner and permission entries the script copies credit, page_url, license and license_url into the article on its next run.
[]
