# Netlify config for the hosted preview: noindex headers, static cache, 404 redirect. The real site build is deployed with
# `bash scripts/deploy_netlify.sh` (build/site, the R8 local publish output); the fixture preview (build/preview) is only for design QA.
[build]
  publish = "build/preview"
  command = "echo 'static preview is built locally; see netlify.toml'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
