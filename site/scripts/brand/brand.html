<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Newsreader'; font-weight: 300 800; src: url('/public/fonts/Newsreader-Variable.woff2') format('woff2'); }
body { margin: 0; background: transparent; font-family: 'Newsreader', serif; font-weight: 600; }
.mark { width: 512px; height: 512px; background: #0E1B33; display: flex; align-items: center; justify-content: center; color: #D6A738; font-size: 380px; line-height: 1; }
.mark span { position: relative; top: -14px; }
.og { width: 1200px; height: 630px; background: #0E1B33; color: #fff; display: flex; flex-direction: column; justify-content: center; padding: 0 96px; box-sizing: border-box; border-bottom: 12px solid #D6A738; }
.og .logo { font-size: 112px; letter-spacing: -0.01em; }
.og .logo sup { color: #D6A738; font-size: 0.55em; vertical-align: super; margin-left: 0.08em; }
.og .tag { font-style: italic; font-weight: 400; font-size: 40px; color: #B8C2D6; margin-top: 24px; }
</style></head><body>
<div class="mark" id="mark"><span>1</span></div>
<div class="og" id="og"><div class="logo">Footnote Daily<sup>1</sup></div><div class="tag">Research-first guides for students, parents and alumni</div></div>
